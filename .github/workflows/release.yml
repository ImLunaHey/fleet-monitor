name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: collector/go.sum
      - run: scripts/check-commits.sh
      - run: go test ./... && go vet ./...
        working-directory: collector
        env:
          CGO_ENABLED: '0'
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: collector/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build tested release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/build-release.sh "$RELEASE_TAG"
      - name: Verify every artifact against the committed Nix manifest
        run: cmp nix/release.json dist-release/release.json
      - name: Publish immutable versioned artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist-release/* --verify-tag --title "$RELEASE_TAG" --generate-notes
